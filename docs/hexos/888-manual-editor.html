<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>888 Manual</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161922; --panel2:#1c2029; --line:#272c38;
    --text:#e6e8ee; --muted:#939aab; --accent:#d6763a; --accent2:#4a9d7f;
    --warn:#c9a227; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 20px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  .meta{color:var(--muted);font-size:12px;font-family:var(--mono)}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
         padding:7px 13px;border-radius:6px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#12141a;font-weight:600}
  button.ghost{background:transparent}
  button.on{border-color:var(--accent);color:var(--accent)}
  #status{font-size:12px;color:var(--muted);font-family:var(--mono);min-width:110px}
  #status.dirty{color:var(--warn)} #status.saved{color:var(--accent2)}
  .wrap{display:flex;align-items:flex-start}
  nav{width:300px;flex:none;position:sticky;top:57px;height:calc(100vh - 57px);
      overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:14px 0 40px}
  nav input{width:calc(100% - 24px);margin:0 12px 10px;padding:7px 9px;font-size:13px;
            background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text)}
  nav a{display:block;padding:4px 12px 4px 0;color:var(--muted);text-decoration:none;
        font-size:13px;border-left:2px solid transparent}
  nav a:hover{color:var(--text);background:var(--panel2)}
  nav a.lv1{padding-left:12px;color:var(--text);font-weight:600;margin-top:10px}
  nav a.lv2{padding-left:24px} nav a.lv3{padding-left:38px;font-size:12px}
  nav a.lv4{padding-left:52px;font-size:12px;opacity:.8}
  nav a.edited{border-left-color:var(--warn)}
  main{flex:1;padding:24px 32px 240px;max-width:1040px}
  section{margin-bottom:22px;border:1px solid var(--line);border-radius:8px;
          background:var(--panel);overflow:hidden}
  section.edited{border-color:var(--warn)}
  .shead{display:flex;align-items:center;gap:10px;padding:9px 14px;
         background:var(--panel2);border-bottom:1px solid var(--line)}
  .shead .h{font-family:var(--mono);font-size:11px;color:var(--accent);flex:none}
  .shead .t{font-weight:600;font-size:14px;flex:1}
  .shead .badge{font-size:10px;font-family:var(--mono);color:var(--warn);
                border:1px solid var(--warn);padding:1px 6px;border-radius:10px;display:none}
  section.edited .badge{display:inline}
  .shead .edit{font-size:11px;padding:3px 9px;opacity:0}
  section:hover .shead .edit{opacity:1}
  .view{padding:2px 16px 12px}
  .view:empty{display:none}
  .view p{margin:.6em 0}
  .view ul,.view ol{margin:.6em 0;padding-left:1.4em}
  .view li{margin:.25em 0}
  .view strong{color:#fff}
  .view em{color:var(--muted)}
  .view code{font-family:var(--mono);font-size:12.5px;background:#12151c;
             border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--accent)}
  .view pre{background:#12151c;border:1px solid var(--line);border-radius:6px;
            padding:11px 13px;overflow-x:auto}
  .view pre code{border:0;background:none;padding:0;color:var(--text)}
  .view a{color:var(--accent2)}
  .view blockquote{margin:.6em 0;padding:.1em 0 .1em 14px;border-left:3px solid var(--line);color:var(--muted)}
  .view hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
  .view table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13.5px}
  .view th,.view td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .view th{background:var(--panel2);font-weight:600}
  .view tr:nth-child(even) td{background:#14171f}
  textarea{width:100%;border:0;background:#12151c;color:var(--text);
           font-family:var(--mono);font-size:13px;line-height:1.65;padding:12px 14px;
           resize:vertical;outline:none;display:block;min-height:44px}
  .hidden{display:none}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);
         border-radius:10px;padding:0;width:min(900px,92vw)}
  dialog header{position:static;border-radius:10px 10px 0 0}
  dialog textarea{min-height:60vh;font-size:12px}
  .hint{color:var(--muted);font-size:12px;padding:0 20px 16px}
</style>
</head>
<body>
<header>
  <h1>888 Manual</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>

  <button class="ghost" id="btnMode">Edit all</button>
  <button class="ghost" id="btnReset">Revert all</button>
  <button class="ghost" id="btnPreview">View markdown</button>
  <button class="primary" id="btnExport">Export .md</button>
</header>
<div class="wrap">
  <nav>
    <input id="filter" placeholder="Filter sections…" autocomplete="off">
    <div id="toc"></div>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <header><h1>Assembled markdown</h1><span class="spacer"></span>
    <button class="ghost" id="btnCopy">Copy</button>
    <button class="ghost" id="btnClose">Close</button></header>
  <textarea id="preview" readonly></textarea>
  <p class="hint">Exactly what "Export .md" downloads. Paste over
     <code>docs/888-user-testing-manual.md</code> or hand it back in chat.</p>
</dialog>

<script>
const SECTIONS = [{"id": "s0", "level": 1, "title": "888 Safety & Training", "body": ""}, {"id": "s1", "level": 2, "title": "Merlin Safety System User Guide and Testing Manual", "body": "**Updated 27 July 2026**\n\nThis manual describes the source and production state checked on 25–27 July 2026. Production is an empty account, so Matt still needs to add the clients, templates, contractors, and services he wants to use; that is operational setup rather than unfinished build work. Database safeguards through migration 037 are applied in production."}, {"id": "s2", "level": 1, "title": "Part 1 — Overview", "body": ""}, {"id": "s3", "level": 2, "title": "What the platform does", "body": "Merlin Safety System gives Matt one place to manage clients, compliance documents, assessments, reports, proposals, contracts, credits, and approved contractors. Each client gets a separate portal where its people can see their own records, complete assigned forms, build templates, sign proposals, and download completed documents."}, {"id": "s4", "level": 2, "title": "Who uses it", "body": "| Role | Person | What they do |\n|---|---|---|\n| Admin / consultant | Matt Robinson | Manages clients, creates templates, carries out assessments, reviews report drafts, issues proposals and contracts, adjusts credits, and watches reminders and errors. |\n| Client | Building owner or facilities manager. The intended QA identity is Sarah Whitfield, Facilities Manager, Hallam House Care Home. | Reviews the organisation's documents, completes forms, builds or adapts templates, signs proposals, downloads contracts and reports, checks credits, and finds approved contractors. |"}, {"id": "s5", "level": 2, "title": "The modules at a glance", "body": "| Module | What it replaces | What you get |\n|---|---|---|\n| Dashboard | Separate client lists, expiry notes, and work queues | One current view of clients, compliance, report reviews, proposals, credits, and failures |\n| Clients | Contact spreadsheets and scattered client folders | One organisation record with contacts, documents, work, agreements, credits, and portal access |\n| Compliance | Certificate folders and manual expiry diaries | Stored documents, red/amber/green status, reminders, and client downloads |\n| Assessments and forms | Paper forms and fixed questionnaires | Versioned forms that Matt or the client can complete |\n| Report generation | Copying assessment notes into a report | A draft prepared from submitted answers, followed by Matt's review and a final PDF |\n| Proposals and contracts | Word quotes, email attachments, and separate signing tools | Service selection, pricing, PDF, signing link, signature record, and service agreement |\n| Billing and credits | A separate retained-time ledger | Whole-credit balance, manual adjustments, purchase history, and a PayPal checkout path |\n| Templates | Rebuilding the same form for each client | Matt-owned masters plus client-owned forms and forks |\n| Service catalogue | Re-entering service descriptions and prices | Reusable proposal line items |\n| Contractor Directory | An informal contact list | A list Matt controls and clients can browse |\n| Notifications | Manual reminder emails | Automated expiry, assignment, report, proposal, contract, invite, and reset emails |\n| Workflow Errors | Searching logs or waiting for a complaint | A visible list of failures that the platform recorded |"}, {"id": "s6", "level": 2, "title": "Logging in", "body": "Use the production address:\n\n`https://www.merlinsafetysystem.com`\n\n| Person | Sign-in page | Current account | Password |\n|---|---|---|---|\n| Matt | `/login/admin` | `mathew.robinson@888safetyandtraining.com` | **UNVERIFIED.** Use Matt's current password or **Forgot?** to set a new one. |\n| Sarah / client tester | `/login` | **No current Sarah account exists in production.** | **UNVERIFIED.** Matt must create Hallam House, invite Sarah, and let her set a password first. |\n\nThe two forms use the same account system, but each form checks the person's role after the password is accepted. If a client uses the operator form, or Matt uses the client form, the platform signs that session back out and tells the person which sign-in page to use. Someone who is already signed in and opens a login page is sent to the correct area automatically.\n\nThe repository also contains `admin@test.com` seed metadata and a non-production helper for `user@test.com`. The 25 July production check confirms that neither authentication account exists there. The helper refuses to run unless someone explicitly enables it and supplies a password of at least 16 characters. These are setup fixtures, not handover credentials; delete or rotate every temporary account and password before go-live."}, {"id": "s7", "level": 2, "title": "Where everything lives", "body": ""}, {"id": "s8", "level": 3, "title": "Matt's admin console", "body": "| Section | Route | What's there |\n|---|---|---|\n| Dashboard | `/admin` | Today's work, clients, expiries, report reviews, proposal totals, credits, and recent errors |\n| Clients | `/admin/clients` | All active and inactive client organisations |\n| Client record | `/admin/clients/[client ID]` | Contacts, documents, compliance, assessments, reports, proposals, credits, assigned forms, and access |\n| Compliance | `/admin/compliance` | All documents split by current, expiring, expired, and no-expiry status |\n| Upcoming expiries | `/admin/expiries` | Expiring and overdue documents with manual reminders |\n| New assessment | `/admin/assessments/new` | Start an assessment for a client |\n| Assessment form | `/admin/assessments/[assessment ID]` | Complete or resume an assessment |\n| Saved answers | `/admin/assessments/[assessment ID]/view` | Read-only source answers |\n| Report review | `/admin/assessments/[assessment ID]/review` | Check and edit the draft before producing the final PDF |\n| Review queue | `/admin/review-queue` | Reports waiting for review and completed reports |\n| Assigned forms | `/admin/assignments` | Pending, in-progress, and completed client assignments |\n| Proposals | `/admin/proposals` | Draft, Sent, Signed, and Issued pipeline |\n| New proposal | `/admin/proposals/new` | Select a client, services, prices, and scope |\n| Proposal detail | `/admin/proposals/[proposal ID]` | Proposal PDF, status actions, services, and issued contract |\n| Credit overview | `/admin/hours` | All client credit balances; the route keeps its old name |\n| Month Summary | `/admin/month-summary` | This month's assessments, uploads, proposals, and errors |\n| Form Templates | `/admin/templates` | Matt's master templates and read-only client templates |\n| Template builder | `/admin/templates/[template ID]` | Build, save, publish, and assign a Matt-owned template |\n| Service Catalog | `/admin/services` | Proposal services, descriptions, units, prices, and active status |\n| Contractors | `/admin/directory` | Add, edit, hide, or delete approved contractors |\n| Notifications | `/admin/notifications` | Successful expiry-reminder history only |\n| Settings | `/admin/settings` | Logo, colours, reminders, PayPal connection, email labels, credits rate, theme, and configuration checks |\n| Diagnostics | `/admin/diagnostics` | Every recorded fault, grouped by cause, with full technical detail, filters, and Resolve |\n| Workflow Errors | `/admin/errors` | The latest recorded failures |\n\nSome working pages are reached from dashboard cards or client records rather than the left sidebar. A missing sidebar link does not mean the route is missing."}, {"id": "s9", "level": 3, "title": "Client portal", "body": "| Section | Route | What's there |\n|---|---|---|\n| Dashboard | `/client` | Compliance position, urgent documents, and credit balance |\n| Compliance | `/client/compliance` | The organisation's compliance documents |\n| Reports | `/client/reports` | Reports in review, failed drafts, and final PDFs |\n| Assessments | `/client/assignments` | Assigned forms to start, resume, or review |\n| Assignment start | `/client/assignments/[assignment ID]` | Instructions and Fill as-is / Customise first |\n| Assignment form | `/client/assignments/[assignment ID]/fill` | The live form |\n| Submitted answers | `/client/assignments/[assignment ID]/submission` | Read-only submitted answers |\n| Templates | `/client/templates` | Forms owned by the client's organisation |\n| Template builder | `/client/templates/[template ID]` | Build, save, and publish an organisation-owned form |\n| Template fill | `/client/templates/[template ID]/fill` | Fill the client's own published template |\n| Proposals | `/client/proposals` | Sent, signed, and issued proposals |\n| Proposal detail | `/client/proposals/[proposal ID]` | View/download and sign a proposal |\n| Contracts | `/client/contracts` | Issued service-agreement PDFs |\n| Contract detail | `/client/contracts/[contract ID]` | Tenant-scoped agreement preview, services, total, and download |\n| Directory | `/client/directory` | Active approved contractors |\n| Billing | `/client/billing` | Credit balance, ledger, and PayPal packages |\n\nThe separate `/client/assessments` history also exists, but it overlaps with the Forms → Assessments area and is not the main navigation destination."}, {"id": "s10", "level": 2, "title": "Current state — read this first", "body": "The platform is ready for handover and reads live records. Production currently contains Matt's operator account and no clients, master templates, service catalogue, contractors, or proposals, so those workflows remain empty until Matt adds operational data.\n\n**Live and ready for handover**\n\n- Client records, invitations, password setup, and role separation are working.\n- Admin and client dashboards use live organisation data.\n- Compliance upload, status, download, and catch-up reminders are working.\n- Matt and clients can build templates; clients can fork a master without changing Matt's original.\n- Creating either a Matt-owned or client-owned template stores the template and its first blank version together. If either write fails, the screen stays open, says nothing was saved, and no client-template activity notice is sent.\n- Assigned forms, resumable drafts, validation, recurrence, and reminders are working.\n- Report drafting, Matt's review step, final PDF creation, storage, email delivery, and client download are working when the AI service is available.\n- Proposal creation, first-party signing, separate original/signed PDFs, and contract generation are implemented.\n- Online signing now verifies the exact original PDF and commits the single-use token, Signed status, signed-file link, hashes, and evidence row together.\n- Issued contracts have both a client list and a tenant-scoped detail page.\n- Credits are the stored balance unit. The editable default reference rate is four credits per hour.\n- The previously open payment-credit permission fault has been fixed and checked in production.\n- Portal brand colours are stored centrally and follow Matt and clients across devices.\n- PayPal can be connected from Settings without a developer or redeployment. The platform checks the pair with PayPal before saving it, encrypts it, never displays the secret again, and lets Matt pause or resume new payments.\n- The audited application dependency is upgraded to 16.2.11; the production build and all 737 runnable tests pass.\n- All four partner notices are live. Both incoming routes are protected, Gmail is retried up to three times, and controlled tests for client template creation, form submission, template customisation, and Matt's assessment submission each returned final delivery confirmation.\n- Merlin Safety System is the platform brand. 888 Safety & Training remains the service provider on proposals, reports, contracts, and PayPal. The only public contact pair is `info@888safetyandtraining.com` and `0333 049 8979`.\n\n**Known limitations after handover**\n\n- Production currently has no saved PayPal connection, so client purchase controls remain off. Matt can connect a Sandbox pair for a no-money test or a Live pair for real payments from Settings; no real provider purchase has yet been completed.\n- Partner-notice failures are recorded in two places: Workflow Errors for the plain-language entry, and Diagnostics for the technical detail. An absent assessment webhook address is now recorded rather than silently skipped. The client event waits up to eight seconds and the assessment event waits up to 15, while the partner workflow may continue for 30 seconds, so a timeout can still be followed by a late admin email.\n- Client-assigned and client-owned form submissions start the same report-drafting process as Matt's submissions.\n- A proposal PDF failure leaves the recoverable Draft and shows an error. A signature-email failure creates a Workflow Error and warns Matt; the signature itself is already stored and is never affected by an email failure.\n- Saved photos reload after refresh using temporary private previews, and Remove deletes the stored file and audit row. Photos are always treated as recommended rather than mandatory, so a phone without camera access can never trap someone mid-form.\n- Client Compliance, Reports, Proposals, Assignments, Assessments, Templates, Contracts, Billing, and Directory show a visible load error instead of pretending a failed query returned no records.\n- Saved sender and sign-off labels are staged and do not change current email. Transactional email stays Merlin-branded, uses the verified Merlin sending domain, and sends replies to the public 888 address.\n- Password reset is limited to three requests per account and 20 per source address each hour; the application change and migration 030 are live.\n- Every error the platform meets is recorded with its technical detail — server pages, background jobs, scheduled reminders, outside services, and the browser — and grouped by cause on the Diagnostics page. Nothing is kept only in short-lived hosting logs.\n\n**Not built**\n\n- Automatic payment receipt or VAT invoice."}, {"id": "s11", "level": 2, "title": "Pending dependencies", "body": "| Dependency | What it unlocks | Status |\n|---|---|---|\n| Production FRA/site-risk master template | A real master assessment that can be assigned | Operational setup; not a handover blocker |\n| Production service names and current prices | Proposal creation | Operational setup; the live catalogue currently has zero rows |\n| Valid PayPal Sandbox or Live REST Client ID and secret | A no-money Sandbox checkout or real-money Live credit purchase | Waiting for Matt's PayPal pair; paste it in Settings, with no developer or redeployment required |\n| Privacy, processor, retention, and access decisions | Responsible handling of assessment data | Unverified |"}, {"id": "s12", "level": 1, "title": "Part 2 — Module Guide", "body": "**Matt's admin modules**"}, {"id": "s13", "level": 2, "title": "Dashboard", "body": ""}, {"id": "s14", "level": 3, "title": "What it does", "body": "The dashboard gathers Matt's live clients, overdue and expiring documents, report drafts, proposal activity, credits, and recent failures."}, {"id": "s15", "level": 3, "title": "How it works", "body": "Counts and lists are read when the page opens. “Items need you today” combines overdue documents and report drafts waiting for review; it is not a general health score."}, {"id": "s16", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Open Dashboard, check Workflow errors first, then Drafts to review and Overdue docs. Open the relevant client or report card rather than relying on the count alone."}, {"id": "s17", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** current records and work queues. **Pending:** the greeting always says Matt even if another operator is added, and a zero count does not prove an external email or partner workflow succeeded."}, {"id": "s18", "level": 3, "title": "Common situations", "body": "- If a count differs from a list, refresh once and open the source section.\n- If the page says there is work but no card appears, check Workflow Errors and the full Compliance or Review Queue page.\n- A newly submitted form is not counted as a draft while the background drafting step is still running. It should then move to Awaiting Review or AI Draft Failed."}, {"id": "s19", "level": 3, "title": "Where to find things", "body": "`/admin`, with deeper links to Clients, Compliance, Review Queue, Proposals, Month Summary, and Workflow Errors."}, {"id": "s20", "level": 2, "title": "Clients", "body": ""}, {"id": "s21", "level": 3, "title": "What it does", "body": "Clients holds one record per organisation, including contacts, documents, assessments, reports, proposals, credits, assigned forms, and portal access."}, {"id": "s22", "level": 3, "title": "How it works", "body": "Creating a client saves the organisation, primary contact, email, optional phone, and optional site address, then tries to send that contact an owner invitation. Edit details can correct those fields later. Deactivating a client keeps its history but stops new uploads, proposals, assessments, form work, balance changes, and invites. Deleting a client removes its related data and portal users and cannot be undone."}, {"id": "s23", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Create the organisation, confirm the contact email, open Access, send or copy the invite link, and verify that the person can sign in before assigning work."}, {"id": "s24", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** organisation, primary contact, site address, Edit details, access, deactivate, and delete flows. **Pending:** production is empty, so Hallam House and Sarah must be created for QA."}, {"id": "s25", "level": 3, "title": "Common situations", "body": "- If email delivery fails, the client record can still exist. Copy the returned invite link and send it through an agreed safe channel.\n- If the client is deactivated, existing records remain visible but new work is blocked.\n- Delete only throwaway QA clients. There is no restore."}, {"id": "s26", "level": 3, "title": "Where to find things", "body": "Clients in the left sidebar, then select an organisation. Use the Access tab for invitations and the Credits tab for the ledger."}, {"id": "s27", "level": 2, "title": "Compliance", "body": ""}, {"id": "s28", "level": 3, "title": "What it does", "body": "Compliance stores client certificates and other evidence, assigns an optional expiry date, shows current/expiring/expired status, and gives the client short-lived view or download links."}, {"id": "s29", "level": 3, "title": "How it works", "body": "Matt uploads a PDF or image up to 25 MB, chooses a category, and may set an expiry date. The platform saves the file and record, optionally emails the client, and checks the expiry range every morning. Failed reminders are recorded and retried."}, {"id": "s30", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Upload the document, confirm the client and expiry date, then open the client record or Compliance list to check its status. Use Upcoming Expiries for manual follow-up."}, {"id": "s31", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** upload, file-header validation, delete, status, download, email delivery, daily 30/14/7/expired reminders, and admin digest. Notices use the organisation's saved primary contact."}, {"id": "s32", "level": 3, "title": "Common situations", "body": "- The threshold uses the UK calendar date: today or earlier is Expired, 1–30 days ahead is Expiring, and more than 30 days ahead is Current.\n- A document without a date appears under No Expiry Date for Matt, but the client dashboard counts it as Current.\n- A successful upload can still have a failed email; check Workflow Errors."}, {"id": "s33", "level": 3, "title": "Where to find things", "body": "`/admin/compliance`, `/admin/expiries`, or the Documents and Compliance tabs inside a client record."}, {"id": "s34", "level": 2, "title": "Assessments and forms", "body": ""}, {"id": "s35", "level": 3, "title": "What it does", "body": "Matt can start and complete an assessment, or assign a published form for the client to complete. The form stays tied to the version chosen at the start."}, {"id": "s36", "level": 3, "title": "How it works", "body": "Starting an assessment creates a draft. Required and conditional fields are checked when any form is submitted. Matt can submit his own assessment, and a client can fill the assigned version, customise it first, or self-fill a client-owned template. Every committed submission enters the same report-drafting process."}, {"id": "s37", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Choose an active client and published template, complete the form on desktop or tablet, review required-field warnings, and submit only when the answers are ready for report drafting.\n\n**Client:** Open Forms → Assessments, read the instructions, choose Fill as-is or Customise first, complete the form, and submit."}, {"id": "s38", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** typed answers, numbers, dates, choices, photos, location, computed score, repeating sections, conditions, autosave/resume, assignment reminders, recurrence, fork-on-fill, client-submission report handoff, private photo previews, complete photo removal, and all four protected admin notices."}, {"id": "s39", "level": 3, "title": "Common situations", "body": "- A revoked assignment cannot be reopened.\n- A completed assignment cannot be edited.\n- A second submit is rejected instead of creating a duplicate.\n- A completed client assignment should move through drafting and appear in Review Queue or AI Draft Failed. It may remain Submitted briefly while the background step runs.\n- The client-form partner notice is only an internal activity email to Matt. It does not generate the report, change the submission, contact the client, or back up files.\n- Photos are always recommended rather than mandatory and never block submission.\n- The review panel is labelled Raw Answers."}, {"id": "s40", "level": 3, "title": "Where to find things", "body": "Use **+ New Assessment**, a template's **Assign to clients** action, `/admin/assignments`, or the Assigned Forms tab inside a client record."}, {"id": "s41", "level": 2, "title": "Report generation", "body": ""}, {"id": "s42", "level": 3, "title": "What it does", "body": "Report generation turns submitted answers into an editable draft, then produces the final client PDF only after Matt approves it."}, {"id": "s43", "level": 3, "title": "How it works", "body": "The drafting service reads the submitted answers and prepares a structured summary, compliance status, and hazards. Matt can compare it with the raw answers, change every section, or regenerate. **Approve & Generate PDF** is the commit point: it creates the final PDF, marks the report completed, and tries to email the client."}, {"id": "s44", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Open Review Queue, read the raw answers, check every claim in the draft, correct the summary, status, hazards, severity, and actions, then approve. Do not use the AI draft as professional advice without checking it."}, {"id": "s45", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** draft, retry, edit, final PDF, private storage, client download, delivery-error logging, and the computed risk matrix. **Pending:** sparse forms can produce invented detail, so Matt's report review remains the controlling check."}, {"id": "s46", "level": 3, "title": "Common situations", "body": "- **AI Draft Failed:** open Workflow Errors, correct any service/configuration fault, then select Retry Draft.\n- **Report saved, but the delivery email failed:** the PDF is final and available in the portal. Check Workflow Errors, then contact the client.\n- You can read and edit the draft without approving it."}, {"id": "s47", "level": 3, "title": "Where to find things", "body": "Dashboard → Drafts to review, `/admin/review-queue`, or the Reports tab in a client record."}, {"id": "s48", "level": 2, "title": "Proposals", "body": ""}, {"id": "s49", "level": 3, "title": "What it does", "body": "Proposals combines client details, catalogue services, quantities, prices, scope wording, VAT, PDF generation, sending, and status tracking."}, {"id": "s50", "level": 3, "title": "How it works", "body": "Matt selects an active client and services. He can write the scope or ask the drafting service for a starting paragraph. The platform calculates line totals and 20% VAT on the server, creates the PDF, and either saves a Draft or sends a signing link."}, {"id": "s51", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Confirm the client contact email and service prices, review the scope, save as Draft if uncertain, open the generated PDF, and only then send for signature."}, {"id": "s52", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** Draft/Sent/Signed/Issued pipeline, catalogue lines, custom price where needed, VAT, PDF, signing link, visible PDF failures, and a warning plus Workflow Error when a signature email fails. A delivery failure leaves the proposal as Sent, because the signing link is valid whether or not the email arrived."}, {"id": "s53", "level": 3, "title": "Common situations", "body": "- **Generate the proposal PDF before sending:** use Generate PDF on the detail page.\n- **Client has no contact email:** correct the client record first.\n- If PDF generation fails, the Draft is retained for retry and the builder should show the failure. Open every completed PDF anyway before sending.\n- Edit from a sent proposal starts a new proposal for that client; it does not edit the document already sent."}, {"id": "s54", "level": 3, "title": "Where to find things", "body": "Proposals in the sidebar, **+ New Proposal**, and the Proposals tab in a client record."}, {"id": "s55", "level": 2, "title": "Signing", "body": ""}, {"id": "s56", "level": 3, "title": "What it does", "body": "Signing gives the client a 30-day, single-use proposal link and records the signer, email, drawn or typed signature, time, network/browser information, and document fingerprint."}, {"id": "s57", "level": 3, "title": "How it works", "body": "The client opens the link, reviews the proposal, enters name and email, draws or types a signature, accepts the terms, and submits. The original proposal remains unchanged; a separate signed copy is created when stamping succeeds."}, {"id": "s58", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Confirm the client received the link, watch the proposal move to Signed, and open the signed PDF. Use Mark as signed only for a genuine paper/email acceptance and keep the outside evidence.\n\n**Client:** Read the proposal and PDF, enter your own details, sign, accept the terms, and submit once."}, {"id": "s59", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** single-use/expiry controls, exact-original verification, first-party signature pad, atomic evidence commit, separate content-addressed signed copy, and automatic contract attempt."}, {"id": "s60", "level": 3, "title": "Common situations", "body": "- **Link expired:** Matt must send a new signing link.\n- **Already signed:** the link has been used and cannot be reused.\n- If the original cannot be verified or the stamped copy cannot be stored, signing does not commit and the token remains unused. Report the error before retrying.\n- Once a proposal is Sent, its client, service lines, total, original PDF, and recorded original fingerprint cannot be materially changed."}, {"id": "s61", "level": 3, "title": "Where to find things", "body": "The client receives `/sign/[private token]`. Matt manages the record from `/admin/proposals/[proposal ID]`."}, {"id": "s62", "level": 2, "title": "Contracts", "body": ""}, {"id": "s63", "level": 3, "title": "What it does", "body": "Contracts creates a service-agreement PDF from a signed proposal and places it in Matt's proposal detail, the client's Contracts list, and a tenant-scoped detail page."}, {"id": "s64", "level": 3, "title": "How it works", "body": "Online signing attempts contract issue automatically. If that fails, Matt can use **Issue contract** on a Signed proposal. The agreement includes the selected services, totals, VAT, signer, and dates."}, {"id": "s65", "level": 3, "title": "Your daily workflow", "body": "**Matt:** After signing, confirm the proposal says Issued and open the Service agreement PDF. If it remains Signed, check Workflow Errors and select Issue contract."}, {"id": "s66", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** PDF generation, Issued status, list, detail preview, download, and contract email."}, {"id": "s67", "level": 3, "title": "Common situations", "body": "- Contract issue is blocked until the proposal is Signed.\n- If the contract email fails, the PDF can still be present in the portal."}, {"id": "s68", "level": 3, "title": "Where to find things", "body": "Matt: proposal detail. Client: Agreements → Contracts, then select the agreement."}, {"id": "s69", "level": 2, "title": "Billing and credits", "body": ""}, {"id": "s70", "level": 3, "title": "What it does", "body": "Billing shows the organisation's whole-credit balance and ledger. Matt can adjust it; clients can see three PayPal packages."}, {"id": "s71", "level": 3, "title": "How it works", "body": "The default reference is four credits per hour, used only to help Matt convert when adjusting a balance. Changing that rate does not recalculate old balances. PayPal packages are 20 credits for £495, 40 for £950, and 80 for £1,800. The platform fixes those amounts before sending the client to PayPal."}, {"id": "s72", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Open the client Credits tab, choose credits or hours as the input aid, check the resulting whole-credit change, and submit. Add a business note outside the platform if the reason needs more detail; the current ledger labels only manual top-up or deduction.\n\n**Client:** Open Billing to see the balance and movements. Purchase controls appear only while Matt's saved PayPal connection is active."}, {"id": "s73", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** stored credits, atomic manual adjustment, overdraft protection, ledger, PayPal connection controls, package and capture logic. **Waiting for setup:** Matt has not saved a production PayPal pair, so checkout is off. **Not built:** receipt or invoice email."}, {"id": "s74", "level": 3, "title": "Common situations", "body": "- A deduction cannot take the balance below zero.\n- Deactivated clients cannot receive a manual balance change.\n- If PayPal took payment but the balance did not move, keep the return page open, retry once, and keep the order reference. Do not add credits manually until the order is checked; the recovery path retains the original connection and prevents a duplicate credit."}, {"id": "s75", "level": 3, "title": "Where to find things", "body": "Client record → Credits, `/admin/hours`, and Client → Billing."}, {"id": "s76", "level": 2, "title": "Form Templates and builder", "body": ""}, {"id": "s77", "level": 3, "title": "What it does", "body": "Matt builds reusable masters. Clients can build their own forms or create a fork while filling an assigned master."}, {"id": "s78", "level": 3, "title": "How it works", "body": "Every Save draft and Publish creates a new version. Assignments use a published version and keep using that version even after the template changes. Matt can inspect client-owned templates but cannot edit, publish, delete, or assign them."}, {"id": "s79", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Create a clearly named template, add fields, preview conditions, Save draft, test it, then Publish. Assign only the published version.\n\n**Client:** Use Templates to create an organisation-owned form, or select Customise first on an assignment. Publish before self-filling."}, {"id": "s80", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** 11 field types, conditions, atomic template-plus-first-version creation, append-only version history, published/referenced-version protection, publishing, assignment, customer ownership, fork-on-fill, soft deletion, and self-fill. **Pending:** no production master exists."}, {"id": "s81", "level": 3, "title": "Common situations", "body": "- A Draft is not assignable; publish it first.\n- Changing a published template creates a later version and does not change an existing assignment.\n- Delete hides and unpublishes the template so it cannot be used for new work; existing assignments, submissions, and pinned versions remain intact."}, {"id": "s82", "level": 3, "title": "Where to find things", "body": "Matt: Form Templates. Client: Forms → Templates or Customise first on an assignment."}, {"id": "s83", "level": 2, "title": "Service Catalog", "body": ""}, {"id": "s84", "level": 3, "title": "What it does", "body": "The catalogue stores reusable services, descriptions, categories, units, and prices for proposals."}, {"id": "s85", "level": 3, "title": "How it works", "body": "Active services appear in the proposal builder. Inactive services remain in Matt's list but cannot be selected for a new proposal. A service without a fixed price asks Matt for a quote-specific value."}, {"id": "s86", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Enter the current service details and prices, and deactivate anything that should not appear in new proposals."}, {"id": "s87", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** add, edit, activate/deactivate, delete, grouping, and proposal use. **Operational setup:** production currently has zero service rows, so New Proposal remains empty until Matt adds or imports services."}, {"id": "s88", "level": 3, "title": "Common situations", "body": "- If the proposal builder is empty, check that services exist and are Active.\n- Deleting a service does not rewrite old proposal line items because each proposal keeps its own copy."}, {"id": "s89", "level": 3, "title": "Where to find things", "body": "Service Catalog in the admin sidebar."}, {"id": "s90", "level": 2, "title": "Contractor Directory", "body": ""}, {"id": "s91", "level": 3, "title": "What it does", "body": "Matt maintains approved contractor contact details; clients see only active, non-deleted entries."}, {"id": "s92", "level": 3, "title": "How it works", "body": "Entries are grouped by category. Inactive keeps an entry for Matt while hiding it from clients; Delete removes it from normal views."}, {"id": "s93", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Add the contractor, check the phone, email, website, category, and approval status, then activate it.\n\n**Client:** Open Directory and use the listed contact details for follow-up work."}, {"id": "s94", "level": 3, "title": "What's live vs. what's pending", "body": "**Live code:** admin management and client browse. **Pending:** production has no contractors and written acceptance of this scope addition should be confirmed."}, {"id": "s95", "level": 3, "title": "Common situations", "body": "- If Matt sees an entry and the client does not, check whether it is Active.\n- The directory says contractors are vetted; Matt owns the accuracy of that claim."}, {"id": "s96", "level": 3, "title": "Where to find things", "body": "Contractors in the admin sidebar; Directory in the client top navigation."}, {"id": "s97", "level": 2, "title": "Notifications", "body": ""}, {"id": "s98", "level": 3, "title": "What it does", "body": "Notifications lists successful automated and manually triggered expiry reminders so Matt can see which document window was sent."}, {"id": "s99", "level": 3, "title": "How it works", "body": "The page reads the reminder ledger. Other emails and form events do not appear there; their failures may appear under Workflow Errors."}, {"id": "s100", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Use Notifications to confirm expiry sends, then use Workflow Errors for failed report, invite, contract, reminder, or partner-event delivery."}, {"id": "s101", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** latest successful automated and manual expiry reminders."}, {"id": "s102", "level": 3, "title": "Common situations", "body": "- An empty Notifications page means no recorded successful expiry reminder, not “all messages are healthy.”\n- A message accepted by the email service can still be filtered or rejected later; confirm in the test inbox."}, {"id": "s103", "level": 3, "title": "Where to find things", "body": "Notifications and Workflow Errors in the admin sidebar."}, {"id": "s104", "level": 2, "title": "Settings", "body": ""}, {"id": "s105", "level": 3, "title": "What it does", "body": "Settings stores the portal logo, practice-wide portal colours, reminder choices, PayPal connection, future email-brand labels, credits-per-hour reference rate, and theme."}, {"id": "s106", "level": 3, "title": "How it works", "body": "The logo, colours, toggles, labels, and rate are stored centrally. Both portal layouts read the colours on every load. For PayPal, Matt chooses Live or Sandbox, pastes the REST Client ID and secret, then selects **Save & Verify**. The pair is checked with PayPal before it is encrypted; the secret is never displayed again. Matt can pause new purchases, and Resume checks the stored connection again before exposing purchase controls. The current Merlin email brand and public 888 Reply-To come from the application rather than the saved labels."}, {"id": "s107", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Change one setting at a time, Save Changes, reload, and confirm it persisted. Connect or rotate PayPal only when you have the complete matching pair and know whether it is Live or Sandbox. Test notification changes with a controlled document rather than assuming the label changes delivery."}, {"id": "s108", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** logo, portal colours across both portals, reminder toggles, upload notice toggle, PayPal connect/rotate/pause/resume, credits rate, and theme. **Waiting for setup:** no production PayPal pair is saved. **Staged:** the saved sender and sign-off labels are not applied to current Merlin-branded email; the screen labels this limitation."}, {"id": "s109", "level": 3, "title": "Common situations", "body": "- A saved colour change should appear on Matt's other device and the client's portal after reload; it does not recolour generated PDFs.\n- Changing the credits rate does not alter existing balances.\n- Turning reminders off pauses email; turning them back on lets the range-based job catch the latest crossed window.\n- **Not connected** means no usable pair is stored; **New payments paused** means the pair is stored but purchase controls are hidden; **Connection needs attention** means the saved encrypted record could not be read safely.\n- Saving a replacement pair while payments are paused keeps them paused. Pausing does not strand a checkout that a client already started."}, {"id": "s110", "level": 3, "title": "Where to find things", "body": "Settings in the admin sidebar."}, {"id": "s111", "level": 2, "title": "Workflow Errors", "body": ""}, {"id": "s112", "level": 3, "title": "What it does", "body": "Workflow Errors shows the latest failures recorded inside the platform by report drafting, email delivery, reminders, signing, contracts, and partner-event transport."}, {"id": "s113", "level": 3, "title": "How it works", "body": "Each row explains the failure type and any recognised client, form, proposal, or assignment detail. For partner notices, the platform accepts success only when the final admin email has been accepted; after a rejection, timeout, empty success, or missing final receipt it records a row here, and the matching technical detail appears in Diagnostics. The partner service also sends Matt a separate failure alert when one of its workflows fails."}, {"id": "s114", "level": 3, "title": "Your daily workflow", "body": "**Matt:** Check this page at the start and end of testing, record the time and related client, fix the source problem, then repeat the original action if it is safe."}, {"id": "s115", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** recent rows are readable, and Diagnostics holds the matching technical detail for each one. **Partial:** only a minority of failure names have tailored plain-language explanations; the rest show the underlying message. Successful partner notices are deliberately not retained in the partner-service history, so the controlled inbox is the delivery check."}, {"id": "s116", "level": 3, "title": "Common situations", "body": "- “No operational errors detected” means no rows matched. If the log itself cannot be read, the page says so instead of showing an empty list. It still does not prove PayPal, inbox delivery, or n8n is healthy — check those directly.\n- A partner notice failure is recorded even if the plain-language write fails, because the technical copy is written separately. Cross-check Diagnostics when Workflow Errors looks emptier than expected.\n- A timeout can be followed by a late email because the platform waits less time than the partner workflow is allowed to run. Check the saved record and inbox before repeating anything.\n- The two historical partner failures that retained the old secret were deleted after the coordinated rotation. Execution history is not proof of delivery.\n- Avoid repeating a payment or signature action until its current state is checked."}, {"id": "s117", "level": 3, "title": "Where to find things", "body": "Workflow Errors in the sidebar for plain-language operational failures. Diagnostics in the sidebar for the full technical record, grouped by cause, with filters for how recent and how serious. Settings → System Diagnostics for configuration checks.\n\n**Client modules**"}, {"id": "s118", "level": 2, "title": "Client Dashboard", "body": ""}, {"id": "s119", "level": 3, "title": "What it does", "body": "The client dashboard shows the organisation's document totals, urgent expiries, and current credits."}, {"id": "s120", "level": 3, "title": "How it works", "body": "It reads only the signed-in organisation's records and lists up to six most urgent documents, expired first."}, {"id": "s121", "level": 3, "title": "Your daily workflow", "body": "**Client:** Check expired and expiring items, open Compliance for the complete list, and use Billing for the full credit ledger."}, {"id": "s122", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** organisation-specific data and mobile navigation. **Partial:** a document with no expiry date counts as Current here."}, {"id": "s123", "level": 3, "title": "Common situations", "body": "- If everything is empty after the organisation should have data, sign out/in and ask Matt to verify the Access link and organisation."}, {"id": "s124", "level": 3, "title": "Where to find things", "body": "Dashboard in the top navigation."}, {"id": "s125", "level": 2, "title": "Client Compliance and Documents", "body": ""}, {"id": "s126", "level": 3, "title": "What it does", "body": "Clients can browse documents by category and open or download their own files."}, {"id": "s127", "level": 3, "title": "How it works", "body": "Each click creates a short-lived link to a private file. The client cannot upload from this screen; Matt owns uploads."}, {"id": "s128", "level": 3, "title": "Your daily workflow", "body": "**Client:** Open Compliance, choose the document, confirm the filename/date/status, then view or download it."}, {"id": "s129", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** organisation-scoped list, short-lived links, and a visible error instead of “No documents yet” when data loading fails."}, {"id": "s130", "level": 3, "title": "Common situations", "body": "- If the link expired, select the document again.\n- If a document is missing, ask Matt to confirm the client, category, and deletion state."}, {"id": "s131", "level": 3, "title": "Where to find things", "body": "Documents → Compliance."}, {"id": "s132", "level": 2, "title": "Client Reports", "body": ""}, {"id": "s133", "level": 3, "title": "What it does", "body": "Reports shows assessments awaiting Matt's review, failed drafts, and completed report PDFs."}, {"id": "s134", "level": 3, "title": "How it works", "body": "Only completed rows have a final PDF. Selecting view or download creates a short-lived link."}, {"id": "s135", "level": 3, "title": "Your daily workflow", "body": "**Client:** Use the status to see progress; download only when the row is Final/Completed."}, {"id": "s136", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** live status and final PDF. **Pending:** delivery email is not guaranteed, so the portal is the reliable copy."}, {"id": "s137", "level": 3, "title": "Common situations", "body": "- Draft means Matt has not approved the final report.\n- Pending after an AI failure needs Matt's attention; the client cannot retry it.\n- A client-completed form may remain absent briefly while drafting runs. If it never appears, Matt should check Workflow Errors."}, {"id": "s138", "level": 3, "title": "Where to find things", "body": "Documents → Reports. Completed assessments also have report actions in `/client/assessments/[id]`."}, {"id": "s139", "level": 2, "title": "Client Billing", "body": ""}, {"id": "s140", "level": 3, "title": "What it does", "body": "Billing shows the current credit balance, recent additions/deductions, and credit packages."}, {"id": "s141", "level": 3, "title": "How it works", "body": "PayPal is the purchase provider. A successful approved order should add credits once and add a ledger row. Each started checkout keeps the exact connection version that created it, so Matt can pause or rotate the saved pair without breaking the client's return."}, {"id": "s142", "level": 3, "title": "Your daily workflow", "body": "**Client:** Review the balance and ledger. Purchase only when Matt says the saved PayPal connection and test mode are ready."}, {"id": "s143", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** balance, ledger, packages, and checkout/capture path. **Waiting for setup:** purchase controls are off until Matt saves a valid pair. **Not built:** receipt/invoice email."}, {"id": "s144", "level": 3, "title": "Common situations", "body": "- **Payments coming soon:** PayPal is not connected or Matt paused new purchases.\n- **Could not start checkout:** credentials or PayPal are unavailable.\n- Keep the return page and order reference if payment succeeds but credits do not appear."}, {"id": "s145", "level": 3, "title": "Where to find things", "body": "Billing in the client navigation."}, {"id": "s146", "level": 2, "title": "Client Assessments", "body": ""}, {"id": "s147", "level": 3, "title": "What it does", "body": "Forms → Assessments shows work assigned by Matt, including due dates, instructions, progress, and submitted answers."}, {"id": "s148", "level": 3, "title": "How it works", "body": "Opening a form creates or resumes one draft. Fill as-is keeps Matt's version; Customise first creates a client-owned fork. Submission completes the assignment, can create the next recurring occurrence, and starts report drafting."}, {"id": "s149", "level": 3, "title": "Your daily workflow", "body": "**Client:** Read the instructions, choose the correct path, complete required fields, wait for photo uploads to finish, and submit once."}, {"id": "s150", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** assignment, resume, validation, submit, reminders, recurrence, report handoff, saved-photo previews, and stored-photo removal."}, {"id": "s151", "level": 3, "title": "Common situations", "body": "- Overdue forms remain fillable until Matt revokes them.\n- A form already submitted opens read-only.\n- An error after submission may be a notification failure even when the answers were saved; return to the list before submitting again."}, {"id": "s152", "level": 3, "title": "Where to find things", "body": "Forms → Assessments."}, {"id": "s153", "level": 2, "title": "Client Templates", "body": ""}, {"id": "s154", "level": 3, "title": "What it does", "body": "Clients can build organisation-owned forms, publish them, and fill them without waiting for Matt."}, {"id": "s155", "level": 3, "title": "How it works", "body": "Each save creates a new draft version. Publish creates a published version. A fork shows that it came from Matt's master but remains owned by the client's organisation. Self-fill saves the answers and starts report drafting."}, {"id": "s156", "level": 3, "title": "Your daily workflow", "body": "**Client:** Create a clear name, add and order fields, Save draft, test the conditions, Publish, then Fill."}, {"id": "s157", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** create, append-only save/publish, fill, fork, soft delete, protected referenced versions, and self-fill report handoff work. A new template and its first blank version are stored together; if either write fails, the dialog stays open and says nothing was saved."}, {"id": "s158", "level": 3, "title": "Common situations", "body": "- A template must have a published version before self-fill.\n- Matt can view a client template but cannot edit it.\n- If creation fails, keep the dialog open and read the message. “Nothing was saved” means there should be no new list entry and no activity notice; retry once, then record the time and report it if the same message returns."}, {"id": "s159", "level": 3, "title": "Where to find things", "body": "Forms → Templates."}, {"id": "s160", "level": 2, "title": "Client Proposals", "body": ""}, {"id": "s161", "level": 3, "title": "What it does", "body": "Clients see proposals Matt has sent, open the PDF, and accept an unsigned proposal."}, {"id": "s162", "level": 3, "title": "How it works", "body": "Draft proposals stay hidden. A Sent proposal offers Accept & Sign; Signed and Issued proposals remain visible for reference."}, {"id": "s163", "level": 3, "title": "Your daily workflow", "body": "**Client:** Open the proposal, read the service lines, total and PDF, then sign only if the document is correct."}, {"id": "s164", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** organisation-specific view/download, email delivery, and first-party signing."}, {"id": "s165", "level": 3, "title": "Common situations", "body": "- If the proposal appears in the portal but no email arrived, use the portal and tell Matt.\n- Never sign after spotting a price or scope error; ask Matt for a corrected new proposal."}, {"id": "s166", "level": 3, "title": "Where to find things", "body": "Agreements → Proposals."}, {"id": "s167", "level": 2, "title": "Client Contracts", "body": ""}, {"id": "s168", "level": 3, "title": "What it does", "body": "Clients can open or download issued service agreements."}, {"id": "s169", "level": 3, "title": "How it works", "body": "The Contracts list reads issued proposals with a contract PDF. Selecting a contract opens a tenant-scoped detail page with an embedded one-hour preview, download, services, total, and issued date."}, {"id": "s170", "level": 3, "title": "Your daily workflow", "body": "**Client:** Open Contracts, select the agreement, check its services and total, then view or download it."}, {"id": "s171", "level": 3, "title": "What's live vs. what's pending", "body": "**Live:** tenant-scoped list, detail, embedded preview, and download."}, {"id": "s172", "level": 3, "title": "Common situations", "body": "- A contract detail URL returns not found if it belongs to another organisation, is not Issued, or has no stored agreement PDF.\n- If the proposal is Signed but no contract appears, Matt must issue or retry the contract."}, {"id": "s173", "level": 3, "title": "Where to find things", "body": "Agreements → Contracts."}, {"id": "s174", "level": 2, "title": "Client Directory", "body": ""}, {"id": "s175", "level": 3, "title": "What it does", "body": "Clients can browse contractors Matt has marked active."}, {"id": "s176", "level": 3, "title": "How it works", "body": "The list is shared across signed-in clients and contains only active entries."}, {"id": "s177", "level": 3, "title": "Your daily workflow", "body": "**Client:** Find the correct category, then use the listed phone, email, or website."}, {"id": "s178", "level": 3, "title": "What's live vs. what's pending", "body": "**Live code:** browse and contact links. **Pending:** no production entries."}, {"id": "s179", "level": 3, "title": "Common situations", "body": "- Ask Matt if a known contractor is missing; it may be inactive or not yet added."}, {"id": "s180", "level": 3, "title": "Where to find things", "body": "Directory in the client navigation."}, {"id": "s181", "level": 1, "title": "Part 3 — Quick Reference", "body": ""}, {"id": "s182", "level": 2, "title": "Compliance status", "body": "| Badge | Meaning |\n|---|---|\n| **CURRENT** | Expiry is more than 30 UK calendar days ahead; the client dashboard's broad Current total also includes undated documents |\n| **EXPIRING** | Expiry is 1–30 UK calendar days ahead, including exactly 30 days |\n| **EXPIRED** | Expiry date is today or earlier |\n| **NO EXPIRY DATE** | Matt's separate admin bucket for documents without a date |\n\nReminder email windows are 30 days, 14 days, 7 days, and expired. If a run was missed, the platform sends the latest crossed window rather than sending every missed reminder."}, {"id": "s183", "level": 2, "title": "Assessment and assignment status", "body": "| Status | Meaning |\n|---|---|\n| **Pending / Assigned** | Matt assigned the form; the client has not started |\n| **In Progress** | A draft exists and can be resumed |\n| **Submitted** | Answers are committed and no longer editable; this is normally the brief state before drafting succeeds or fails |\n| **Awaiting Review** | The report draft is ready for Matt |\n| **AI Draft Failed** | Drafting failed; Matt can inspect the error and retry |\n| **Completed / Final** | Matt approved the report and the PDF exists |\n| **Revoked** | Matt removed the assignment; it can no longer be used |"}, {"id": "s184", "level": 2, "title": "Proposal status", "body": "| Status | Meaning |\n|---|---|\n| **Draft** | Saved for Matt; hidden from the client |\n| **Sent** | Signing link created; confirm the client actually received it |\n| **Signed** | Online signature or a paper/email acceptance recorded by Matt |\n| **Issued** | Service-agreement PDF created |"}, {"id": "s185", "level": 2, "title": "Template status", "body": "| Status | Meaning |\n|---|---|\n| **Draft** | Work can continue; it cannot be assigned or self-filled as the published version |\n| **Published** | Available for assignment or self-fill |\n| **Unpublished draft present** | A newer saved draft exists while an older published version remains available |\n| **Forked** | Client-owned copy linked to a Matt-owned master |"}, {"id": "s186", "level": 2, "title": "The 11 active field types", "body": "| Field | Use |\n|---|---|\n| Short Text | One line of typed text |\n| Number | Numeric answer |\n| Date | Calendar date |\n| Select | One choice from a list |\n| Long Text | Multi-line typed notes |\n| Checkbox | A single tick/yes-no style answer |\n| Section | Groups related fields |\n| Photos | Multiple compressed images |\n| Location | Coordinates and map preview |\n| Computed | Automatic risk score from configured inputs |\n| Repeating Section | Repeat a group for each door, hazard, floor, or similar item |\n\nSignature and Rating are not active builder fields. The proposal signing pad is a separate agreement feature."}, {"id": "s187", "level": 2, "title": "Glossary", "body": "| Term | Plain-language meaning |\n|---|---|\n| Assignment | A form Matt has sent to a client to complete |\n| Assessment | A completed or in-progress fire-safety form and its report work |\n| Client | The organisation, such as Hallam House Care Home |\n| Client user | A person allowed into that organisation's portal |\n| Credits | The stored retained-work balance |\n| Fork | A client-owned copy of Matt's template |\n| Master | Matt's original reusable template |\n| Pinned version | The exact form version kept with an assignment or submission |\n| Proposal | Price and scope offered before agreement |\n| Contract / service agreement | The issued agreement created after signing |\n| RAG | Red/amber/green compliance position: expired, expiring, current |\n| Signed link | A short-lived private file link; it can expire and be created again |\n| Workflow error | A recorded background, drafting, email, signing, or partner-event failure |"}, {"id": "s188", "level": 2, "title": "What to do when something looks wrong", "body": "1. **Check whether the action actually committed.** Return to the list and look for the new row, status, PDF, ledger movement, or submitted answer before repeating anything.\n2. **Refresh once.** Some screens can hold an older view after a background step.\n3. **Check Workflow Errors.** Record the time, client, form/proposal, and exact message.\n4. **Check the client's portal.** A failed email does not always mean the file or report is missing.\n5. **Do not repeat money or signing actions blindly.** Confirm the PayPal order, credit ledger, proposal status, and signature state first.\n6. **Capture useful evidence.** Take a screenshot, copy the route without private tokens, and record the steps immediately before the problem."}, {"id": "s189", "level": 2, "title": "Pending-dependencies master list", "body": "- Real Hallam House and Sarah QA account.\n- Production FRA/site-risk master template; this is operational setup, not a handover blocker.\n- Production service catalogue entries; this is operational setup needed only for proposals.\n- Valid PayPal Sandbox or Live REST credentials; Matt can paste them directly in Settings.\n- Billing receipt/invoice.\n- Privacy, retention, processor, and access decisions."}, {"id": "s190", "level": 2, "title": "Who to ask", "body": "**Client:** Ask Matt through the contact details shown in the portal footer: `info@888safetyandtraining.com` or `0333 049 8979`.\n\n**Matt:** Owns service prices, contractor approval, client access, and the final decision to release a report or agreement.\n\n**Platform support:** The named technical contact is **UNVERIFIED**. Matt should ask whoever controls deployment, live data, email, and PayPal for configuration or security faults.\n\n**Finley / partner automation:** The workflows and production cutover are live. The exact workflow IDs and controlled-delivery results are recorded in the research brief."}, {"id": "s191", "level": 1, "title": "Part 4 — QA Walkthroughs", "body": "Use throwaway records and controlled inboxes. Each walkthrough states its commit point so the tester can inspect the screen without creating a permanent record. Never use a real client, live proposal, or real payment for these walkthroughs."}, {"id": "s192", "level": 2, "title": "QA 1 — Login and role separation", "body": ""}, {"id": "s193", "level": 3, "title": "Before you start", "body": "Matt needs a working operator password. The client tester needs a separately invited client account. Use a private browser window for the second person.\n\n1. **Matt:** Open `/login/admin`, enter the operator account, and sign in. Confirm the address ends in `/admin`.\n2. **Matt:** Open `/client` directly. Confirm the platform returns you to the admin area without showing client content.\n3. **Client:** Open `/login`, sign in, and confirm the address ends in `/client`.\n4. **Client:** Open `/admin` directly. Confirm no admin content appears and the operator sign-in is shown.\n5. **Client:** Sign out, try the client credentials at `/login/admin`, and confirm the page rejects operator access rather than opening the console.\n6. **Matt:** Try the operator credentials at `/login` and confirm the page tells you to use Operator access.\n7. **Matt:** Sign out, open **Forgot?**, enter the controlled operator address once, and confirm the page gives the same neutral response whether or not an account exists.\n8. **Matt:** Open the reset message, set a temporary password, sign in, then replace it with the agreed handover password after QA."}, {"id": "s194", "level": 3, "title": "Errors / exception states you might see", "body": "- **Invalid login credentials:** the password or account is wrong.\n- **Account doesn't have operator access:** the account is a client.\n- **This is the client portal:** the account is Matt's operator account.\n- No reset email after the neutral success message: check Workflow Errors and inbox filtering; the screen deliberately does not reveal whether an address exists."}, {"id": "s195", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Open a known admin-only client record while signed in as the client. It must not render, even briefly."}, {"id": "s196", "level": 3, "title": "When something looks wrong", "body": "Confirm the exact email, sign out fully, clear the private window, and ask Matt to check whether the account appears under the correct client Access tab."}, {"id": "s197", "level": 3, "title": "Known gaps until dependencies land", "body": "Sarah has no current production account. Create and invite her before running this walkthrough. The reset limit is live, but do not flood a real inbox to test the threshold manually."}, {"id": "s198", "level": 2, "title": "QA 2 — Create Hallam House and invite Sarah", "body": ""}, {"id": "s199", "level": 3, "title": "Before you start", "body": "Use Sarah's controlled QA inbox, not a real customer address. Decide whether the created Hallam House record will be retained or deleted after testing.\n\n1. **Matt:** Open Clients and select New Client.\n2. **Matt:** Enter `Hallam House Care Home`, Sarah Whitfield, her controlled email, an optional test phone number, and a test site address.\n3. **Matt:** Stop before Create and review spelling and email. Selecting Create is the commit point.\n4. **Matt:** Create the client, open its Access tab, and confirm Sarah appears or an invitation action is available.\n5. **Matt:** Send or resend the invite. If the email reports a failure, copy the invitation link and record that fallback was used.\n6. **Client:** Open the invitation once, set a new temporary QA password, and sign in.\n7. **Client:** Confirm the portal header says Hallam House Care Home and Sarah Whitfield.\n8. **Matt:** Return to Access and confirm Sarah is listed as Owner and the account state is consistent with the completed invitation.\n9. **Matt:** Select Edit details, change one harmless contact value, save, reload, and restore it. Confirm the site address can also be corrected."}, {"id": "s200", "level": 3, "title": "Errors / exception states you might see", "body": "- The client can be created while invite delivery fails.\n- An invite link is single use; opening it twice should not create a second session.\n- A duplicate email may belong to an existing account and needs deliberate linking rather than a second identity."}, {"id": "s201", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "As Sarah, verify that no other organisation's records appear in Dashboard, Compliance, Billing, Forms, Proposals, Contracts, or Directory."}, {"id": "s202", "level": 3, "title": "When something looks wrong", "body": "Check the Access tab, Sarah's spam folder, Workflow Errors, and the copied fallback link. Do not repeatedly create the same user."}, {"id": "s203", "level": 3, "title": "Known gaps until dependencies land", "body": "Email delivery is working; an individual missing message should still be checked in the recipient inbox and Workflow Errors."}, {"id": "s204", "level": 2, "title": "QA 3 — Compliance document and expiry status", "body": ""}, {"id": "s205", "level": 3, "title": "Before you start", "body": "Prepare four harmless PDFs under 25 MB: one expired yesterday, one expiring in 14 days, one expiring in 31 calendar days, and one with no expiry date.\n\n1. **Matt:** Open Compliance and choose Upload Document.\n2. **Matt:** Select Hallam House, choose a category, attach the expired file, and set yesterday's date.\n3. **Matt:** Stop before Upload and confirm client, category, file, and date. Upload is the commit point.\n4. **Matt:** Upload the remaining three files with their matching dates.\n5. **Matt:** Confirm the files appear under Expired, Expiring, Current, and No Expiry Date. The screen uses UK calendar dates, so 30 days is Expiring and 31 days is Current.\n6. **Client:** Open Documents → Compliance and confirm all four files appear only for Hallam House.\n7. **Client:** Open and download one file, then wait for its temporary link to expire or reopen later and confirm a fresh click works.\n8. **Matt:** Open Upcoming Expiries and inspect the manual reminder option. Stop before sending if the inbox test has not been approved.\n9. **Matt:** If approved, send one reminder and confirm the controlled inbox and Notifications ledger."}, {"id": "s206", "level": 3, "title": "Errors / exception states you might see", "body": "- Unsupported type, file above 25 MB, or file whose bytes do not match its claimed type is rejected.\n- Upload can succeed while its notification email fails.\n- The client dashboard counts the undated file as Current even though Matt has a separate No Expiry Date bucket."}, {"id": "s207", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Confirm the filename, client, category, expiry date, and actual downloaded bytes. Then sign in as a second test organisation and confirm the file is absent."}, {"id": "s208", "level": 3, "title": "When something looks wrong", "body": "Check Compliance filters, the client record's Documents tab, Workflow Errors, and whether the file was deleted or the client deactivated."}, {"id": "s209", "level": 3, "title": "Known gaps until dependencies land", "body": "Expiry reminders use Hallam House's saved primary contact. Upload notices still need an agreed rule if several portal users exist."}, {"id": "s210", "level": 2, "title": "QA 4 — Build and publish Matt's master template", "body": ""}, {"id": "s211", "level": 3, "title": "Before you start", "body": "Use clearly labelled QA questions and test inputs. The Computed field uses the platform's live risk matrix.\n\n1. **Matt:** Open Form Templates and create `QA Hallam House Assessment`.\n2. **Matt:** Add all 11 field types once, using a Section and a Repeating Section to group sensible test questions.\n3. **Matt:** Add one required field and one conditional field. Turn Required on for the Photos field, then verify during filling that the screen calls it recommended and does not use it to block submission.\n4. **Matt:** Configure the Computed field only with clearly labelled test inputs.\n5. **Matt:** Select Save draft. This writes a new draft version but does not make it assignable.\n6. **Matt:** Reload and confirm the fields and order remain.\n7. **Matt:** Stop before Publish and review every label, option, condition, and risk wording. Publish is the release point for assignments.\n8. **Matt:** Publish and confirm the template shows Published."}, {"id": "s212", "level": 3, "title": "Errors / exception states you might see", "body": "- A rule loop or unsupported nested specialty field is rejected.\n- A Draft cannot be assigned.\n- Saving twice creates later versions; it does not overwrite the earlier version."}, {"id": "s213", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Open the template after reload, inspect the version number, and start an assignment without committing it to confirm the client picker and published version are available."}, {"id": "s214", "level": 3, "title": "When something looks wrong", "body": "Remove the most recent condition or nested field, save again, and read the exact validation message. Do not delete a template that has assignments."}, {"id": "s215", "level": 3, "title": "Known gaps until dependencies land", "body": "Production currently has no master template. Create or import one before testing assignment."}, {"id": "s216", "level": 2, "title": "QA 5 — Assign, fill as-is, and submit", "body": ""}, {"id": "s217", "level": 3, "title": "Before you start", "body": "QA 2 and QA 4 must be complete. Choose a due date at least eight days ahead if reminder testing is planned.\n\n1. **Matt:** Open the published master and select Assign to clients.\n2. **Matt:** Choose Hallam House, add test instructions and a due date.\n3. **Matt:** Stop before Assign and verify the client and due date. Assign is the commit point.\n4. **Matt:** Assign the form and confirm it appears in Assigned Forms or `/admin/assignments`.\n5. **Client:** Open Forms → Assessments, select the assignment, read the instructions, and choose Fill as-is.\n6. **Client:** Enter part of the form, leave the page, reopen it, and confirm the draft resumed.\n7. **Client:** Try to submit with a required field empty and confirm the platform blocks submission.\n8. **Client:** Complete all required fields. Add a test photo, wait until its upload finishes, leave and reopen the draft, confirm the saved preview appears, remove it, reload to confirm it stays removed, then add one final test photo.\n9. **Client:** Stop before Submit and review every answer. Submit is the final commit point and the form becomes read-only.\n10. **Client:** Submit once and confirm the assignment moves to Completed and submitted answers can be opened.\n11. **Matt:** Confirm the assignment and submission appear under Hallam House. Refresh Review Queue until the submission becomes Awaiting Review or AI Draft Failed; it may remain Submitted briefly while drafting runs."}, {"id": "s218", "level": 3, "title": "Errors / exception states you might see", "body": "- **Already submitted:** a second click or repeat request was blocked.\n- **Revoked assignment:** Matt removed it.\n- **Saved photos could not be previewed:** refresh once. If the message remains, record the submission and field rather than re-uploading duplicates."}, {"id": "s219", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Compare the submitted answer view with the values entered, including conditional fields and repeating rows."}, {"id": "s220", "level": 3, "title": "When something looks wrong", "body": "Return to the assignment list before retrying. If it says Completed, do not submit again; inspect the submitted answers and Workflow Errors."}, {"id": "s221", "level": 3, "title": "Known gaps until dependencies land", "body": "Photos are recommended rather than mandatory and never block a submission."}, {"id": "s222", "level": 2, "title": "QA 6 — Customise first and customer-owned templates", "body": ""}, {"id": "s223", "level": 3, "title": "Before you start", "body": "Create a fresh second assignment from Matt's master so QA 5's completed assignment remains unchanged.\n\n1. **Client:** Open the new assignment and select Customise first.\n2. **Client:** Confirm the builder opens a client-owned copy and shows that it was forked.\n3. **Client:** Add, remove, or reorder a harmless test field, then Save draft.\n4. **Client:** Stop before Publish and confirm Matt's original still looks unchanged in a separate session. Publish commits the forked version.\n5. **Client:** Publish and return to the assignment.\n6. **Client:** Fill and submit the forked form.\n7. **Matt:** Open Form Templates and confirm the client template appears under Client templates and is read-only.\n8. **Matt:** Open the master and confirm its fields did not change.\n9. **Client:** Create a separate template from scratch and confirm its blank builder opens immediately. Publish it, self-fill it without an assignment, then confirm the answers are saved and the submission reaches Review Queue or AI Draft Failed."}, {"id": "s224", "level": 3, "title": "Errors / exception states you might see", "body": "- Matt should not see edit, publish, delete, or assign controls on a client-owned template.\n- A customer template without a published version cannot be self-filled.\n- If template creation cannot commit both required records, the dialog should stay open and say “Nothing was saved”; Matt should receive no activity notice."}, {"id": "s225", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Compare the master and fork side by side, then confirm the submitted answers use the fork's extra field."}, {"id": "s226", "level": 3, "title": "When something looks wrong", "body": "Do not delete either template. Record the two names and version numbers, then check whether the assignment points to the fork."}, {"id": "s227", "level": 3, "title": "Known gaps until dependencies land", "body": "Real production content is still needed for realistic testing; there is no longer a known first-version gap in create-from-scratch."}, {"id": "s228", "level": 2, "title": "QA 7 — Admin assessment, draft review, and final report", "body": ""}, {"id": "s229", "level": 3, "title": "Before you start", "body": "A published master and valid drafting-service key are required. Use deliberately simple answers whose correct report content
