is obvious.\n\n1. **Matt:** Select + New Assessment, choose Hallam House and the QA template, and start.\n2. **Matt:** Complete the form with one clear low-risk item and one clear urgent hazard.\n3. **Matt:** Stop before Submit and copy the answers to the QA notes. Submit starts report drafting.\n4. **Matt:** Open Review Queue. If drafting is still running, wait and refresh; if it failed, open Workflow Errors and use Retry Draft.\n5. **Matt:** Open the report draft and expand Raw Answers. Confirm this contains the typed source answers.\n6. **Matt:** Compare every generated claim with the source. Deliberately edit the summary, one severity, and one recommended action.\n7. **Matt:** Stop before Approve & Generate PDF. Up to this point no final client report exists.\n8. **Matt:** Approve, confirm a PDF opens, and confirm the submission leaves Awaiting Review.\n9. **Client:** Open Reports and download the final PDF.\n10. **Matt:** Compare the PDF with your approved edits, not with the first AI draft.\n11. **Client:** Open the completed report in the portal and confirm it matches the final PDF Matt approved."}, {"id": "s230", "level": 3, "title": "Errors / exception states you might see", "body": "- **AI Draft Failed:** configuration/service failure or invalid output; inspect the error and retry.\n- **Report saved, but the delivery email failed:** the PDF exists in the portal, but the current build does not automatically retry the email.\n- Empty or overconfident draft text from sparse answers is a content-quality failure, even when the system technically succeeded."}, {"id": "s231", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Confirm the client can download the PDF, another client cannot, and a second approval click does not send another report."}, {"id": "s232", "level": 3, "title": "When something looks wrong", "body": "Do not approve. Copy the raw answers and draft, take a screenshot, and record whether the problem is source data, generated wording, or final PDF."}, {"id": "s233", "level": 3, "title": "Known gaps until dependencies land", "body": "Sparse answers can lead to invented detail, so Matt's review is the controlling check."}, {"id": "s234", "level": 2, "title": "QA 8 — Service catalogue and proposal draft", "body": ""}, {"id": "s235", "level": 3, "title": "Before you start", "body": "Use test services and prices that cannot be mistaken for real quotes. Hallam House needs a contact email.\n\n1. **Matt:** Open Service Catalog and add two test services, one with a fixed price and one without a fixed price.\n2. **Matt:** Stop before Save on each item and confirm the category, unit, description, and price. Save commits the catalogue item.\n3. **Matt:** Deactivate one service and confirm it remains in the catalogue but disappears from New Proposal.\n4. **Matt:** Start a proposal for Hallam House and select the active services.\n5. **Matt:** Enter a quote-specific price for the no-price service and change quantities.\n6. **Matt:** Ask for a draft scope, then rewrite part of it so it matches the actual work.\n7. **Matt:** Save as Draft. This is the proposal commit point but does not expose it to Sarah.\n8. **Matt:** Open the Draft from the pipeline and confirm the line totals, 20% VAT, client, scope, and PDF."}, {"id": "s236", "level": 3, "title": "Errors / exception states you might see", "body": "- Missing drafting-service configuration should show an error in production.\n- A PDF generation or upload failure should show that the proposal was retained as Draft and could not produce its PDF.\n- If the builder reports success without a working PDF, log it as a regression."}, {"id": "s237", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Calculate subtotal, VAT, and total independently. Open the PDF rather than relying on the pipeline card."}, {"id": "s238", "level": 3, "title": "When something looks wrong", "body": "Keep the proposal as Draft, use Generate PDF if available, and do not send until the document opens and totals match."}, {"id": "s239", "level": 3, "title": "Known gaps until dependencies land", "body": "Production currently has zero service rows. Add the real catalogue when Matt is ready to create proposals; this does not block platform handover."}, {"id": "s240", "level": 2, "title": "QA 9 — Send, sign, and issue the contract", "body": ""}, {"id": "s241", "level": 3, "title": "Before you start", "body": "Use a controlled Sarah inbox and an explicitly test-only proposal. Do not use a live client proposal for this walkthrough.\n\n1. **Matt:** Open the verified Draft and select Send for signature.\n2. **Matt:** Stop before the final send action if the tester has not agreed to receive the link. Sending changes status to Sent and creates a 30-day link.\n3. **Client:** Confirm the email arrived. If it did not, open the proposal through Agreements → Proposals and report the delivery failure.\n4. **Client:** Open the proposal, PDF, service lines, and total. Stop before accepting if anything differs.\n5. **Client:** Select Accept & Sign, enter the test signer details, test Draw and Type modes, accept the terms, and stop before the final submit.\n6. **Client:** Submit once. Confirm the success screen and that a second use of the link says Already signed.\n7. **Matt:** Confirm the pipeline moved to Signed or Issued and open the signed proposal copy.\n8. **Matt:** If it remains Signed, check Workflow Errors and select Issue contract.\n9. **Client:** Open Agreements → Contracts, select the agreement, and confirm the detail page shows the expected services, total, issued date, preview, and download.\n10. **Client:** Copy the detail URL into the same signed-in session and confirm it still opens. A different organisation must receive not found."}, {"id": "s242", "level": 3, "title": "Errors / exception states you might see", "body": "- **Expired:** send a new link.\n- **Already signed:** do not create a second signature.\n- **Document changed / evidence unavailable:** signing did not commit. Keep the proposal and link state intact while Matt checks the original PDF and Workflow Errors.\n- Proposal says Sent but inbox is empty: Matt should see a warning and a `proposal_signature_request` Workflow Error. The client can use the portal meanwhile — the signing link is valid regardless.\n- Auto-issue can fail after signature; the signature remains valid and Matt can retry contract issue."}, {"id": "s243", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Compare the original and signed PDF, confirm the original content is unchanged, and confirm the contract uses the signed proposal's services and total."}, {"id": "s244", "level": 3, "title": "When something looks wrong", "body": "Do not mark a proposal manually signed to hide an online failure. Preserve the link state, proposal status, PDF, time, and Workflow Error for diagnosis."}, {"id": "s245", "level": 3, "title": "Known gaps until dependencies land", "body": "There is no additional signing dependency. Preserve the Sent proposal and use its recorded link and Workflow Error rather than repeating a send blindly."}, {"id": "s246", "level": 2, "title": "QA 10 — Manual credits and PayPal", "body": ""}, {"id": "s247", "level": 3, "title": "Before you start", "body": "Manual credits can be tested with Hallam House. For a no-money checkout, use a PayPal Sandbox REST app and Sandbox buyer. For a real checkout, use the Live pair and the smallest package deliberately; production has no saved pair today.\n\n1. **Matt:** Open Hallam House → Credits and note the starting balance.\n2. **Matt:** Enter a +8 credit adjustment and inspect the hours conversion hint.\n3. **Matt:** Stop before Submit. Submitting changes the balance and ledger together.\n4. **Matt:** Submit, then confirm the balance increased by 8 and one ledger row appeared.\n5. **Matt:** Enter −3 credits, submit, and confirm the balance and second ledger row.\n6. **Matt:** Try a deduction larger than the balance and confirm it is rejected with no ledger row.\n7. **Client:** Open Billing and confirm the same balance and movements.\n8. **Matt:** Open Settings → PayPal connection. Confirm the Client ID and secret fields are blank. Choose Sandbox or Live, paste the matching REST Client ID and secret, then stop before **Save & Verify**; selecting it verifies and stores the pair.\n9. **Matt:** Select **Save & Verify**. Confirm the status becomes **Connected**, only a short Client ID hint remains, and the secret field is blank.\n10. **Client:** Open Billing and inspect the 20/40/80 packages and prices. Purchase the chosen test package and return to Billing.\n11. **Client:** Confirm exactly one purchase ledger row and exactly one credit increase, even after refreshing the return page.\n12. **Matt:** If new purchases should stop after the test, select **Pause new payments**. Confirm the client sees **Payments coming soon**. Resume only when you want purchases available; Resume checks PayPal again."}, {"id": "s248", "level": 3, "title": "Errors / exception states you might see", "body": "- **PayPal rejected these credentials:** the mode and pair do not match; nothing was stored.\n- **PayPal could not be reached:** verification timed out or PayPal was unavailable; nothing was stored.\n- **Payments coming soon:** PayPal is not connected or new purchases are paused.\n- **Could not start checkout:** the saved connection or PayPal is unavailable.\n- **Payment capture failed:** keep the order return information and do not buy again."}, {"id": "s249", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Confirm Settings shows the selected mode and only the Client ID hint, never the secret. Match the PayPal order, GBP amount, package, client, ledger row, and balance. Confirm no second credit after refresh."}, {"id": "s250", "level": 3, "title": "When something looks wrong", "body": "Do not “fix” a disputed payment with a manual top-up until the PayPal order and capture state are known."}, {"id": "s251", "level": 3, "title": "Known gaps until dependencies land", "body": "No production pair is saved and no real provider purchase has been completed. The platform has no automatic receipt/invoice or PayPal refund, reversal, or dispute handling."}, {"id": "s252", "level": 2, "title": "QA 11 — Contractor Directory", "body": ""}, {"id": "s253", "level": 3, "title": "Before you start", "body": "Use an obviously fictional contractor and controlled contact details.\n\n1. **Matt:** Open Contractors and add the test company as Active.\n2. **Matt:** Stop before Save and verify every public detail. Save makes it visible to signed-in clients.\n3. **Client:** Open Directory and confirm the entry, category, phone, email, and website.\n4. **Matt:** Change the entry to Inactive.\n5. **Client:** Refresh and confirm the entry disappears.\n6. **Matt:** Reactivate, edit one detail, and confirm the client sees the change.\n7. **Matt:** Delete the throwaway contractor after the test."}, {"id": "s254", "level": 3, "title": "Errors / exception states you might see", "body": "- An inactive entry remains visible to Matt but not the client.\n- Invalid website text may still produce a link; test the final URL."}, {"id": "s255", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Sign in as two client organisations and confirm both see the same active approved directory."}, {"id": "s256", "level": 3, "title": "When something looks wrong", "body": "Check Active status and whether the entry was deleted before creating a duplicate."}, {"id": "s257", "level": 3, "title": "Known gaps until dependencies land", "body": "Production is empty and the Directory's scope acceptance should be confirmed."}, {"id": "s258", "level": 2, "title": "QA 12 — Settings, notifications, and failure visibility", "body": ""}, {"id": "s259", "level": 3, "title": "Before you start", "body": "Record all current Settings values so they can be restored. Use a controlled test document and inbox. Do not rotate a connected PayPal pair during this walkthrough; QA 10 covers the committed connection and checkout flow.\n\n1. **Matt:** Change Saved Sign-off Name, Save Changes, reload, and confirm the value persisted. This is a stored future label, not a current email change.\n2. **Matt:** Restore it. Repeat with Credits per Hour, then restore 4. Confirm no existing balance changed.\n3. **Matt:** Change a colour, save, reload in the same browser, and confirm it persists.\n4. **Matt:** Open another signed-in admin device and Sarah's portal, reload, and confirm the saved colour follows to both.\n5. **Matt:** Upload a temporary logo, confirm it appears in the client footer, then restore/remove it.\n6. **Matt:** Turn Notify on document upload off, upload a test document, and confirm the document saves without an email.\n7. **Matt:** Turn it back on, upload another test document, and check the controlled inbox and Workflow Errors.\n8. **Matt:** Inspect the PayPal connection card. Confirm its status agrees with QA 10 and both entry fields are blank; stop without selecting **Save & Verify**.\n9. **Matt:** Open Notifications and confirm it contains successful expiry reminders only.\n10. **Matt:** Open Workflow Errors and inspect any failure created during QA. Then open Diagnostics and confirm the same failure appears there with its technical detail."}, {"id": "s260", "level": 3, "title": "Errors / exception states you might see", "body": "- A Settings success message does not mean the sender label changed real email.\n- SVG logos and files whose real header does not match PNG, JPEG, or WebP are rejected.\n- PayPal entry fields are deliberately blank after every save; the status, mode, short Client ID hint, and verification date are the positive confirmation.\n- Partner notices are not tested from Settings. The live n8n routes reject unauthorised or incomplete events and confirm success only after the admin email is accepted; use QA 15.\n- An empty Workflow Errors page is not proof that email, PayPal, or the error-log read itself is healthy."}, {"id": "s261", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Reload, use a second browser, inspect the controlled inbox, and compare the portal record with Notifications and Workflow Errors."}, {"id": "s262", "level": 3, "title": "When something looks wrong", "body": "Restore the original settings first, then record which device/browser, action, client, and time produced the difference."}, {"id": "s263", "level": 3, "title": "Known gaps until dependencies land", "body": "Email identity is configured elsewhere. Partner-notice testing is open through QA 15 because the production secrets and four controlled checks now pass."}, {"id": "s264", "level": 2, "title": "QA 13 — Dashboard and queue reconciliation", "body": ""}, {"id": "s265", "level": 3, "title": "Before you start", "body": "Complete the client, compliance, client-assignment, Matt-led report, proposal, and manual-credit walkthroughs first so the dashboards have known records. This walkthrough is read-only.\n\n1. **Matt:** Open Dashboard and note the client, overdue/expiring, report-review, proposal, credit, and Workflow Error figures.\n2. **Matt:** Open Clients and confirm Hallam House and its credit balance match the dashboard.\n3. **Matt:** Open Compliance and compare the Expired and Expiring lists with the dashboard cards.\n4. **Matt:** Open Review Queue. Confirm the Matt-led draft or completed report appears in the right tab.\n5. **Matt:** Confirm the client-submitted assignment from QA 5 reached Awaiting Review or AI Draft Failed. A short Submitted period is expected; a submission that stays there needs investigation.\n6. **Matt:** Open Proposals and Workflow Errors and reconcile their current rows with the dashboard.\n7. **Matt:** Open Month Summary and compare records created in the current UTC month with the underlying assessment, upload, proposal, and error lists.\n8. **Client:** Open Dashboard and compare its document totals and credit balance with Documents → Compliance and Billing.\n9. **Client:** Confirm the urgent document list shows expired items before expiring items and contains no other organisation's record."}, {"id": "s266", "level": 3, "title": "Errors / exception states you might see", "body": "- On Compliance, Reports, and Proposals, a failed client data load should show an error panel. “No records” should be reserved for a successful empty result.\n- A recently changed background status can need one refresh.\n- An undated document counts as Current on the client dashboard but has its own admin bucket."}, {"id": "s267", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Compare specific record names and IDs, not only totals. Open every dashboard card used in the comparison and confirm it reaches the expected source list."}, {"id": "s268", "level": 3, "title": "When something looks wrong", "body": "Check the underlying list, current status, record date, and Workflow Errors. For Month Summary, record the timestamp and remember that its boundary is UTC."}, {"id": "s269", "level": 3, "title": "Known gaps until dependencies land", "body": "Dashboard counts do not prove an individual message reached its inbox or that PayPal and partner workflows are healthy."}, {"id": "s270", "level": 2, "title": "QA 14 — Tablet and mobile pass", "body": ""}, {"id": "s271", "level": 3, "title": "Before you start", "body": "Use Matt's Surface Pro or iPad for admin assessment work and a real phone-sized browser for Sarah. Keep the connection online throughout.\n\n1. **Matt:** On tablet, open Dashboard, Clients, a client record, New Assessment, the form, and Report Review.\n2. **Matt:** Rotate the tablet and confirm buttons, field labels, repeating rows, photo capture, location, and approval controls remain usable.\n3. **Matt:** Do not approve the report during layout testing; stop before Approve & Generate PDF.\n4. **Client:** On mobile, open the menu and visit every top-level section.\n5. **Client:** Start a throwaway assignment, type into each basic field, add a repeating row, and test a photo.\n6. **Client:** Leave and resume online. Confirm saved text returns.\n7. **Client:** Stop before Submit unless this is the dedicated submission walkthrough.\n8. **Client:** Open a proposal, the signing page, Billing, a compliance document, and a report."}, {"id": "s272", "level": 3, "title": "Errors / exception states you might see", "body": "- Losing connection can lose unsaved work or leave an upload incomplete.\n- Private-file links can expire and should be opened again from the portal.\n- A saved-photo preview error should produce a visible message; repeated blank spinners or broken images are regressions."}, {"id": "s273", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Test portrait and landscape, browser zoom, the mobile menu, keyboard focus, scrolling, and the final action buttons without committing."}, {"id": "s274", "level": 3, "title": "When something looks wrong", "body": "Record device, operating-system version, browser, orientation, route, and whether the connection changed."}, {"id": "s275", "level": 3, "title": "Known gaps until dependencies land", "body": "An active internet connection is required throughout."}, {"id": "s276", "level": 2, "title": "QA 15 — Partner activity notices", "body": ""}, {"id": "s277", "level": 3, "title": "Before you start", "body": "The current application release and both production secrets are live. The old general secret has been rotated at both ends, all four controlled event payloads passed, and the old secret-bearing execution records were deleted. Both routes are protected, invalid events are rejected, Gmail is retried, success follows final mail acceptance, and the controlled failure alert has passed. Use a throwaway organisation and Matt's controlled admin inbox; this walkthrough proves the user-action triggers and inbox content.\n\n1. **Matt:** Confirm you can use the controlled admin inbox, then agree the throwaway organisation and record names before creating anything.\n2. **Client:** Prepare a named test template. **Create** is the commit point; create it once, then confirm it appears in the portal.\n3. **Matt:** Confirm one “client created a form template” message arrived and that no new related Workflow Error appeared. Successful partner runs are deliberately not retained.\n4. **Client:** Self-fill the template. Stop before **Submit** until the record is safe to commit, then submit once and confirm report drafting starts.\n5. **Matt:** Confirm one form-submitted message arrived and no related Workflow Error appeared. Do not resubmit to chase email.\n6. **Client:** On a throwaway assignment, choose **Customise first** once and confirm Matt's master is unchanged.\n7. **Matt:** Confirm one template-customised message arrived and no related Workflow Error appeared.\n8. **Matt:** Submit one throwaway admin assessment. Confirm report drafting starts, one separate assessment-submitted message arrives, and no related Workflow Error appears."}, {"id": "s278", "level": 3, "title": "Errors / exception states you might see", "body": "- The client record can save while its admin notice fails; the portal record remains the source of truth.\n- **403 / unauthorised:** the two ends do not have the same secret, or the request omitted it.\n- **422 / invalid event:** a required event field is missing; record the event type and action, then check the current application release.\n- **Success without delivery confirmation:** the partner route answered without proving the Gmail step; the application treats this as a failure and attempts to record it.\n- **Timeout followed by an email:** the platform stopped waiting after eight seconds for a client event or 15 seconds for Matt's assessment, but the partner workflow completed later. Do not repeat the committed action.\n- **No Workflow Error row:** the error-row write may itself have failed. A missing assessment webhook address is also skipped, although that address is currently present in production.\n- An “[888] Automation failed” message means the failure workflow worked. Use its workflow, step, and execution link to investigate."}, {"id": "s279", "level": 3, "title": "When nothing looks wrong but you want to be sure", "body": "Match every committed action to exactly one admin inbox message, confirm there is no related Workflow Error, and confirm ordinary customer email still comes only from the platform."}, {"id": "s280", "level": 3, "title": "When something looks wrong", "body": "Do not repeat the client write or assessment submission. Record the event type, organisation, record reference, time, application result, n8n execution result, and inbox result."}, {"id": "s281", "level": 3, "title": "Known gaps until dependencies land", "body": "None for these four notices. Every production notice path passed its controlled delivery check."}];

    ta.rows = Math.min(40, Math.max(2, ta.value.split("\n").length + 1));
    ta.className = "hidden";
    sec.appendChild(ta);

    const toEdit = () => { view.classList.add("hidden"); ta.classList.remove("hidden");
                           ta.focus(); head.querySelector(".edit").textContent = "Done"; };
    const toView = () => { view.innerHTML = mdToHtml(ta.value); view.classList.remove("hidden");
                           ta.classList.add("hidden"); head.querySelector(".edit").textContent = "Edit"; };

    head.querySelector(".edit").addEventListener("click", () =>
      ta.classList.contains("hidden") ? toEdit() : toView());
    view.addEventListener("dblclick", toEdit);
    ta.addEventListener("keydown", (e) => { if (e.key === "Escape") toView(); });
    ta.addEventListener("input", () => {
      edits[s.id] = ta.value;
      if (ta.value === s.body) delete edits[s.id];
      sec.classList.toggle("edited", isEdited(s));
      a.classList.toggle("edited", isEdited(s));
      persist();
    });
    sec._toEdit = toEdit; sec._toView = toView;
    main.appendChild(sec);
  }
  if (editAll) main.querySelectorAll("section").forEach(x => x._toEdit());
  persist();
}

$("btnMode").addEventListener("click", () => {
  editAll = !editAll;
  $("btnMode").textContent = editAll ? "Read all" : "Edit all";
  $("btnMode").classList.toggle("on", editAll);
  document.querySelectorAll("main section").forEach(x => editAll ? x._toEdit() : x._toView());
});
$("filter").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  for (const a of $("toc").children)
    a.style.display = a.textContent.toLowerCase().includes(q) ? "" : "none";
});
$("btnExport").addEventListener("click", () => {
  const blob = new Blob([assemble()], {type:"text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "888-user-testing-manual.md"; a.click();
  URL.revokeObjectURL(a.href);
});
$("btnPreview").addEventListener("click", () => { $("preview").value = assemble(); $("dlg").showModal(); });
$("btnClose").addEventListener("click", () => $("dlg").close());
$("btnCopy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(assemble());
  $("btnCopy").textContent = "Copied";
  setTimeout(() => $("btnCopy").textContent = "Copy", 1200);
});
$("btnReset").addEventListener("click", () => {
  if (!confirm("Discard all edits and restore the committed text?")) return;
  edits = {}; localStorage.removeItem(KEY); render();
});

render();
</script>
</body>
</html>
